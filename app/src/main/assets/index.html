<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">N</div><div><h1>NOVA Anime Library</h1><p>Your Anime collection · Watch tracker</p></div><button id="add">＋ Anime</button><button id="watch">Watching</button><button id="files">File Manager</button></header><main><section class="stats"><div><b id="total">0</b>Total Anime</div><div><b id="done">0</b>Completed</div><div><b id="progress">0</b>Watching</div><div><b id="later">0</b>Plan to watch</div></section><section class="filters"><input id="search" placeholder="Search anime name..."><select id="filter"><option value="all">All statuses</option><option value="watched">Completed</option><option value="partial">Watching</option><option value="unwatched">Plan to watch</option></select><select id="sort"><option value="az">Name A–Z</option><option value="za">Name Z–A</option></select></section><div id="genres" class="genres"></div><h2>All Anime</h2><div id="grid" class="grid"></div></main><dialog id="addDialog"><form method="dialog"><h2>Add Anime</h2><input id="name" placeholder="Anime name" required><input id="genre" placeholder="Genre"><button id="save">Save</button></form></dialog><dialog id="player"><h2 id="videoTitle"></h2><video id="video" controls></video><button id="other">Open in another player</button><button id="close">Close</button></dialog><script src="app.js"></script></body></html>
