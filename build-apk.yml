name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Apply native player code
        run: |
          PKG=android/app/src/main/java/com/hda/anime
          mkdir -p "$PKG"
          cp android-overlay/ExternalPlayerPlugin.java android-overlay/MainActivity.java "$PKG/"
          mkdir -p android/app/src/main/res/xml
          cp android-overlay/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          grep -q "fileprovider" android/app/src/main/AndroidManifest.xml || python3 android-overlay/add_provider.py
          grep -n "fileprovider" android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: anime-library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
